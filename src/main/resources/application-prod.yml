spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:50}
      minimum-idle: 10
    # ===== 读写分离（add-performance-deepening task3+4）=====
    # 生产多数据源：master=主库、slave=从库（GTID 复制）；主从连接串分别由 DB_URL / SLAVE_DB_URL 注入。
    # 默认(不加 @DS)走 master（写与强一致读），非强一致读加 @DS("slave") 走从库；原 spring.datasource 兜底保留。
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: ${DB_URL}
          username: ${DB_USERNAME}
          password: ${DB_PASSWORD}
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            maximum-pool-size: ${DB_POOL_MAX:50}
            minimum-idle: 10
        slave:
          url: ${SLAVE_DB_URL}
          username: ${SLAVE_DB_USERNAME}
          password: ${SLAVE_DB_PASSWORD}
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
            maximum-pool-size: ${SLAVE_DB_POOL_MAX:20}
            minimum-idle: 4
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      # 默认分库调整为 1（dev 保持 0），消除共用单实例时测试与生产数据互相污染的隐患
      database: ${REDIS_DATABASE:1}
      timeout: 3s
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      # SMTP 三向超时毫秒（fix-mail-smtp-timeout-and-catch）：默认无限等 → SMTP 故障挂线程
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  sql:
    init:
      # 生产用独立 DDL 迁移脚本管理（此处关闭应用内自动建表）
      mode: never

# OpenAPI 契约暴露（add-backend-openapi）：生产环境默认关闭 swagger-ui（可通过配置覆盖）
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true

# ===== Actuator 暴露面收敛（harden-actuator-exposure，安全专项发现 2）=====
# prod 只暴露观测必需端点：health（compose healthcheck 打 /actuator/health/db，只看 HTTP 状态码）
# 与 prometheus（内网抓取依赖，Grafana 面板与告警全部走该出口）。info 默认空载零价值、
# metrics 的聚合出口是 prometheus（JSON 明细不再暴露）。健康细节收敛为 never：
# DB/Redis/SMTP 等组件名与连接状态不再未认证可读。base/dev 档保持全暴露（开发便利与测试观测）。
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
