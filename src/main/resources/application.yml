server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: exam-online
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  mvc:
    throw-exception-if-no-handler-found: true
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:exam}
    password: ${RABBITMQ_PASSWORD:exam123}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 生产者 confirm：交卷消息到达 broker 才算发送成功（削峰链路可靠性的第一环）
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 消费者手动 ack：批量落库成功才确认，未确认消息断连后自动重投
        acknowledge-mode: manual
        prefetch: ${RABBIT_PREFETCH:200}
        concurrency: ${RABBIT_CONCURRENCY:2}
        auto-startup: ${RABBIT_LISTENER_AUTOSTARTUP:true}
  # 全局默认事务超时（秒），防止长事务占用连接池
  transaction:
    default-timeout: 30

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

logging:
  level:
    com.exam: ${LOG_LEVEL:info}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{40} - %msg%n"

# 认证配置（add-authentication）
exam:
  auth:
    jwt:
      # HS256 签名密钥，长度必须 >= 32 字节；生产必须通过环境变量 JWT_SECRET 注入
      secret: ${JWT_SECRET:}
      access-expire-minutes: 30
      refresh-expire-days: 7
    admin:
      # 首次启动自动创建的管理员账号（AdminInitializer）
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin123}
    lock:
      # 连续失败阈值与锁定分钟数（登录锁定）
      max-failures: 5
      lock-minutes: 15
    rate-limit:
      # 登录接口限流：次/分钟/账号+IP
      per-minute: 10
    reset-code:
      # 找回密码验证码：有效分钟数与长度
      ttl-minutes: 5
      length: 6
  schedule:
    # 考试状态机扫表间隔（定时发布/自然结束推进），毫秒；不依赖外部调度中间件
    fixed-delay-ms: 10000
  taking:
    # 交卷链路（add-exam-taking）
    submit:
      # SETNX 一次性锁 TTL（秒）：防持有者崩溃后死锁，正常在 finally 中主动释放
      lock-ttl-seconds: 30
      # 交卷消息等待 broker confirm 的超时（毫秒），超时视为发送失败走草稿兜底
      mq-confirm-timeout-ms: 5000
    mq:
      # 消费者单批拉取消息数（DB 批量落库按此分批，rewriteBatchedStatements 生效前提）
      batch-size: 100
      prefetch: 200
      # 批量容器并发（batchContainerFactory 消费）：默认 1 与改动前实际行为一致（此前手工 new 工厂、从未设并发，
      # 实际并发=1），不借"修配置"之名隐式提速；容量模型见 RabbitMqConfig.batchContainerFactory 注释。
      # 注意：spring.rabbitmq.listener.simple.concurrency 只作用于 Boot 自动装配的工厂，对交卷消费者无效。
      concurrency: ${RABBIT_BATCH_CONCURRENCY:1}
      # 消费失败重试阈值：重发计数超过该值进死信队列
      retry-max: 3
    draft:
      # Redis 草稿 TTL 基数（小时）：在个人截止时间基础上叠加，供断线恢复与超时兜底取答案
      ttl-hours: 2
    sweep:
      # 超时兜底/答案补发扫描间隔（毫秒）与单轮上限（500/批）
      fixed-delay-ms: 10000
      initial-delay-ms: 10000
      batch-size: 500
      max-rounds: 10
  anticheat:
    # 行为事件计数器 TTL（小时）：需大于最长考试时长，保证整场考试计数窗口完整（add-anti-cheat）
    counter-ttl-hours: 12
    switch-screen:
      # 切屏次数阈值（可配置）：累计切屏达到 medium-threshold 升"中"、达到 high-threshold 升"高"；
      # 0 表示关闭对应档位升级。只警告 + 记录，绝不强制交卷（决策记录 §3.1）
      medium-threshold: 3
      high-threshold: 5
  monitor:
    # 监考在线心跳窗口（秒）：大于自动保存周期（30s）的合理超时，过期即离线（add-anti-cheat）
    online-ttl-seconds: 60
    # 慢 SQL 阈值（毫秒）（add-performance-deepening 阶段8 可观测性 task6）：
    # MyBatis 拦截器按此判断，单条 SQL 执行超过该值输出 WARN 日志（含耗时/SQL/requestId）
    slow-sql-threshold-ms: ${SLOW_SQL_THRESHOLD_MS:1000}
  datasource:
    # 读写分离读己之写窗口（add-performance-deepening task3+4，ReadYourWriteMark 消费）：
    # 写操作（交卷/发布/批改）完成后在当前线程置 ThreadLocal 标记，窗口(ms)内非强一致读强制转主库。
    # 为什么是"短窗口"而非永久路由主库：主从同步通常毫秒~秒级，
    # 永久走主库会让从库形同虚设、丢失读写分离收益；窗口恰好覆盖 GTID 复制延迟峰值。
    read-your-write-window-ms: ${READ_YOUR_WRITE_WINDOW_MS:5000}
  cache:
    # 缓存三防配置（add-performance-deepening 阶段 8，CacheConfig/CacheMutexLoader 消费）：
    # 穿透=空值缓存（NOT_FOUND 短 TTL 空标记）、击穿=Redis SETNX 互斥锁重建、雪崩=TTL 随机抖动
    # 快照类缓存（考试/试卷快照）：发布后只读不可变，缓存与 DB 天然一致，可用长 TTL
    snapshot-base-ttl: 2h
    snapshot-jitter: 20m
    # 考试详情缓存：有更新路径（create/update/publish/forceEnd），短 TTL 兜底 + 写路径显式 @CacheEvict
    detail-base-ttl: 5m
    detail-jitter: 1m
    # 防击穿互斥锁：SETNX 持有时长上限，防持锁线程崩溃后死锁（正常在 finally 主动释放）
    lock-ttl-seconds: 10
    # 未抢到锁的等待节奏：每轮间隔与最大轮数（总等待 = interval × rounds，超时后兜底直接回源）
    wait-interval-ms: 50
    wait-max-rounds: 20
    # 防穿透空值缓存开关与短 TTL：查无结果写入空标记，期间同 key 查询不再直击 DB
    null-cache-enabled: true
    null-ttl-seconds: 30
  ratelimit:
    # 接口限流（add-slow-sql-and-rate-limit task3，RedisTokenBucket 消费）：
    # 令牌桶按接口维度，桶容量/速率在各 Controller 方法的 @RateLimit 注解声明（交卷/拉卷/抽题各独立阈值）；
    # 此处仅配置桶 key 的 TTL：接口连续被访问即续期，长时间无请求后桶自动过期、下次重建满桶，
    # 避免闲置桶残留占用内存。各接口具体 capacity/qps 取值见对应 Controller 方法上的中文注释依据。
    key-ttl-seconds: ${RATELIMIT_KEY_TTL:120}
    # 默认放行以保核心链路可用（fail-open）：Redis 异常时核心接口仍可用，降级计数 exam.ratelimit.degraded 暴露给告警；
    # 置 false 则异常上抛（fail-close），Redis 故障时核心链路快速失败。
    fail-open: ${RATE_LIMIT_FAIL_OPEN:true}

  retention:
    # 数据保留策略（add-data-retention）：按考试生命周期清理三张辅助表。
    # 硬口径「宁可不删，不可错删」——默认关闭 + 默认 dry-run，真删须显式双开并会打启动 WARN。
    # 目标表：exam_behavior_logs / exam_submit_dedups / score_audit_logs（仅按 exam_id 删，命中既有索引）。
    # 不清理业务事实；不纳入 exam_dlq_messages（无 exam_id）。不声称磁盘释放。
    enabled: false
    dry-run: true
    retention-days: 180
    batch-size: 1000
    max-batches-per-run: 20
    max-exams-per-run: 100
    cron: "0 30 3 * * *"

# API 限流配置（add-api-rate-limiting 提案）：与 exam.ratelimit（@RateLimit 注解 + RedisTokenBucket）
# 是两套独立机制，此块供 RateLimitConfig 的全局拦截器消费
rate-limiting:
  enabled: ${RATE_LIMITING_ENABLED:true}
  qps: ${RATE_LIMIT_QPS:100}
  burst: ${RATE_LIMIT_BURST:150}
  key-prefix: api:ratelimit

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# OpenAPI 契约暴露（add-backend-openapi）：springdoc 配置
# 仅追加，不改既有 spring 配置语义
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # 按字母排序操作，便于前端查阅契约
    operationsSorter: alpha
  # 只扫描 exam 包下的 Controller
  packages-to-scan: com.exam
  # 匹配 /api/** 路径
  paths-to-match: /api/**
  # 安全 scheme 已在 SpringDocConfig 中定义

# OpenTelemetry 追踪配置（add-distributed-tracing）
# 全部用扁平点号键：OTel 自动装配按字面属性名读取 otel.*，不走 Spring 的 relaxed binding，
# 写成 service_name / export.enabled 这类嵌套会被静默忽略。
otel.service.name: ${OTEL_SERVICE_NAME:exam-online}
# 链路走 OTLP gRPC -> Jaeger all-in-one:4317；不设 OTEL_TRACES_EXPORTER 时即关闭导出
otel.traces.exporter: ${OTEL_TRACES_EXPORTER:otlp}
otel.traces.sampler: parentbased_traceidratio
# 采样比例：默认全采（dev），prod 用 OTEL_TRACES_SAMPLER_ARG=0.1 降到 10%
otel.traces.sampler.arg: ${OTEL_TRACES_SAMPLER_ARG:1}
# 指标仍由 Micrometer/Prometheus 出（actuator），日志仍由 logback 出，两条 exporter 关掉避免重复采集
otel.metrics.exporter: none
otel.logs.exporter: none
