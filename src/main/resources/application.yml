server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: exam-online
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  mvc:
    throw-exception-if-no-handler-found: true
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:exam}
    password: ${RABBITMQ_PASSWORD:exam123}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 生产者 confirm：交卷消息到达 broker 才算发送成功（削峰链路可靠性的第一环）
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 消费者手动 ack：批量落库成功才确认，未确认消息断连后自动重投
        acknowledge-mode: manual
        prefetch: ${RABBIT_PREFETCH:200}
        concurrency: ${RABBIT_CONCURRENCY:2}
        auto-startup: ${RABBIT_LISTENER_AUTOSTARTUP:true}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

logging:
  level:
    com.exam: ${LOG_LEVEL:info}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{40} - %msg%n"

# 认证配置（add-authentication）
exam:
  auth:
    jwt:
      # HS256 签名密钥，长度必须 >= 32 字节；生产用环境变量 JWT_SECRET 覆盖
      secret: ${JWT_SECRET:examOnline-dev-jwt-secret-please-change-in-prod-0123456789}
      access-expire-minutes: 30
      refresh-expire-days: 7
    admin:
      # 首次启动自动创建的管理员账号（AdminInitializer）
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin123}
    lock:
      # 连续失败阈值与锁定分钟数（登录锁定）
      max-failures: 5
      lock-minutes: 15
    rate-limit:
      # 登录接口限流：次/分钟/账号+IP
      per-minute: 10
    reset-code:
      # 找回密码验证码：有效分钟数与长度
      ttl-minutes: 5
      length: 6
  schedule:
    # 考试状态机扫表间隔（定时发布/自然结束推进），毫秒；不依赖外部调度中间件
    fixed-delay-ms: 10000
  taking:
    # 交卷链路（add-exam-taking）
    submit:
      # SETNX 一次性锁 TTL（秒）：防持有者崩溃后死锁，正常在 finally 中主动释放
      lock-ttl-seconds: 30
      # 交卷消息等待 broker confirm 的超时（毫秒），超时视为发送失败走草稿兜底
      mq-confirm-timeout-ms: 5000
    mq:
      # 消费者单批拉取消息数（DB 批量落库按此分批，rewriteBatchedStatements 生效前提）
      batch-size: 100
      prefetch: 200
      # 消费失败重试阈值：重发计数超过该值进死信队列
      retry-max: 3
    draft:
      # Redis 草稿 TTL 基数（小时）：在个人截止时间基础上叠加，供断线恢复与超时兜底取答案
      ttl-hours: 2
    sweep:
      # 超时兜底/答案补发扫描间隔（毫秒）与单轮上限（500/批）
      fixed-delay-ms: 10000
      initial-delay-ms: 10000
      batch-size: 500
      max-rounds: 10
  anticheat:
    # 行为事件计数器 TTL（小时）：需大于最长考试时长，保证整场考试计数窗口完整（add-anti-cheat）
    counter-ttl-hours: 12
    switch-screen:
      # 切屏次数阈值（可配置）：累计切屏达到 medium-threshold 升"中"、达到 high-threshold 升"高"；
      # 0 表示关闭对应档位升级。只警告 + 记录，绝不强制交卷（决策记录 §3.1）
      medium-threshold: 3
      high-threshold: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
