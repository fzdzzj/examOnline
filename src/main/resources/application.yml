server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: exam-online
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  mvc:
    throw-exception-if-no-handler-found: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

logging:
  level:
    com.exam: ${LOG_LEVEL:info}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{40} - %msg%n"

# 认证配置（add-authentication）
exam:
  auth:
    jwt:
      # HS256 签名密钥，长度必须 >= 32 字节；生产用环境变量 JWT_SECRET 覆盖
      secret: ${JWT_SECRET:examOnline-dev-jwt-secret-please-change-in-prod-0123456789}
      access-expire-minutes: 30
      refresh-expire-days: 7
    admin:
      # 首次启动自动创建的管理员账号（AdminInitializer）
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin123}
    lock:
      # 连续失败阈值与锁定分钟数（登录锁定）
      max-failures: 5
      lock-minutes: 15
    rate-limit:
      # 登录接口限流：次/分钟/账号+IP
      per-minute: 10
    reset-code:
      # 找回密码验证码：有效分钟数与长度
      ttl-minutes: 5
      length: 6
  schedule:
    # 考试状态机扫表间隔（定时发布/自然结束推进），毫秒；不依赖外部调度中间件
    fixed-delay-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
