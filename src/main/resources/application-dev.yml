spring:
  datasource:
    # 本地开发默认连接（可用环境变量覆盖：DB_URL / DB_USERNAME / DB_PASSWORD）
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/exam_online?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  mail:
    # 本地开发未配置 SMTP 时，验证码走日志兜底
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  sql:
    init:
      # 开发环境用 classpath:schema.sql 幂等建表（CREATE TABLE IF NOT EXISTS）
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:schema.sql
      continue-on-error: false

management:
  health:
    mail:
      # 本地未配置 SMTP 时禁用 mail 健康检查（生产 profile 保持启用，SMTP 为必需）
      enabled: ${MAIL_HEALTH_ENABLED:false}
