spring:
  datasource:
    # ===== 读写分离（add-performance-deepening task3+4）测试数据源 =====
    # dynamic-datasource 接管后主从都指向同一 H2 内存库（DB_CLOSE_DELAY=-1，schema 仅在 primary 初始化，
    # master 与 slave 共享该库，保证既有用例与读写分离用例都能读到建表；路由正确性用 @DS(SlaveProbe) 断言）。
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:h2:mem:exam;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
          driver-class-name: org.h2.Driver
          username: sa
          password:
        slave:
          url: jdbc:h2:mem:exam;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
          driver-class-name: org.h2.Driver
          username: sa
          password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      # 端口可注入：本机 6379 被其他项目占用时，用临时 Redis 跑测试（REDIS_PORT=6390）
      port: ${REDIS_PORT:6379}
      database: 15
      timeout: 3s
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: exam
    password: exam123
    listener:
      simple:
        # 测试环境无 broker：监听容器不启动，交卷发送在各用例中 Mock 断言
        auto-startup: false
  mail:
    host:

# 认证测试配置：固定 JWT 密钥（>=32 字节），锁定阈值调低便于测试
exam:
  auth:
    jwt:
      secret: test-only-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      access-expire-minutes: 30
      refresh-expire-days: 7
    admin:
      username: admin
      password: admin123
    lock:
      max-failures: 5
      lock-minutes: 15
    rate-limit:
      per-minute: 10
    reset-code:
      ttl-minutes: 5
      length: 6
  taking:
    sweep:
      # 测试环境禁用定时兜底（间隔拉到 1h）：需要兜底的用例直接调用 sweepService.sweep()，
      # 避免定时 tick 干扰 MQ 发送次数断言
      fixed-delay-ms: 3600000
      initial-delay-ms: 3600000
  cache:
    # 缓存三防测试参数：等待轮数放宽到 2s（击穿用例慢回源 300ms，等待线程须在兜底回源前读到回填值）
    wait-interval-ms: 25
    wait-max-rounds: 80

# 全局 API 限流在测试环境默认关闭：20+ 集成测试类共用 127.0.0.1 这一 clientId，
# 默认阈值（qps=100/burst=150）下重循环用例会被偶发 429 打断。限流本身由
# RateLimitInterceptorIntegrationTest 用 @TestPropertySource 单独开启并验证。
rate-limiting:
  enabled: false

# SMTP 未配置时禁用 mail 健康检查，避免 /actuator/health 恒为 DOWN
management:
  health:
    mail:
      enabled: false
    rabbit:
      # 测试环境无 broker：禁用 rabbit 健康检查（add-exam-taking 引入 amqp 后默认启用）
      enabled: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 测试环境没有 OTLP collector：关掉链路导出，免得 BatchSpanProcessor 在后台刷连接失败日志。
# 采样器仍照常装配，MybatisTracingInterceptor / TraceIdInterceptor 走的是本地 Span。
otel.traces.exporter: none
