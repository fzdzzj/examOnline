# 抓取配置：只消费 examOnline 已暴露的指标（BusinessMetrics + actuator）。
# 指标名刻意不写 hikaricp_connections_*：本项目用 dynamic-datasource，
# 其 Hikari 指标能否被 Boot 自动绑定未经实测，写错会让规则永久静默。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 加载告警规则（容器内挂载到 /etc/prometheus/rules）
rule_files:
  - /etc/prometheus/rules/exam-online-alerts.yml

# 告警投递：Alertmanager 接入（compose 编排网内，add-alert-delivery）
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # job 名固定为 exam-online：告警规则与面板中的 job 标签都引用它
  - job_name: exam-online
    metrics_path: /actuator/prometheus
    static_configs:
      # host.docker.internal 在 Docker Desktop 开箱即用（适用于本地宿主机开发与调试）；
      # Linux 宿主机上需配合 compose 里的 extra_hosts 才可解析到宿主。
      # 在 Docker Compose 生产容器拓扑中，若应用作为容器运行（如服务名 exam-online-prod-app），
      # 需将 target 切换为容器网络服务名与端口（例如 ["exam-online-prod-app:8080"]），避免因网络不可达导致 up==0 假告警常鸣。
      - targets: ["host.docker.internal:8080"]
