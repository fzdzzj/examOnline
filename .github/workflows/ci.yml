name: CI Gate

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend gate (mvnw clean test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache .m2-repo
        uses: actions/cache@v4
        with:
          path: .m2-repo
          key: m2-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-

      - name: Run backend gate (mvnw clean test)
        shell: bash
        run: |
          ./mvnw clean test 2>&1 | tee /tmp/ci-backend-mvnw.log
          exit "${PIPESTATUS[0]}"

      - name: Assert surefire baseline and BUILD SUCCESS banner
        shell: bash
        run: |
          bash .github/ci/assert_backend.sh /tmp/ci-backend-mvnw.log .github/ci/gate-baseline.json

      - name: Assert openapi paths baseline
        shell: bash
        run: |
          bash .github/ci/check_openapi_paths.sh openapi.yaml .github/ci/gate-baseline.json

  frontend:
    name: Frontend gate (lint / type-check / test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm version pinned by packageManager field
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Install dependencies (frozen lockfile)
        working-directory: frontend
        shell: bash
        run: |
          pnpm install --frozen-lockfile

      - name: Run lint:check
        working-directory: frontend
        shell: bash
        run: |
          pnpm run lint:check 2>&1 | tee /tmp/ci-frontend-lint.log
          exit "${PIPESTATUS[0]}"

      - name: Run type-check:check
        working-directory: frontend
        shell: bash
        run: |
          pnpm run type-check:check 2>&1 | tee /tmp/ci-frontend-typecheck.log
          exit "${PIPESTATUS[0]}"

      - name: Run test
        working-directory: frontend
        shell: bash
        run: |
          pnpm run test 2>&1 | tee /tmp/ci-frontend-test.log
          exit "${PIPESTATUS[0]}"

      - name: Assert frontend baselines and banners
        shell: bash
        run: |
          bash .github/ci/assert_frontend.sh /tmp/ci-frontend-lint.log /tmp/ci-frontend-typecheck.log /tmp/ci-frontend-test.log .github/ci/gate-baseline.json

  dependency-scan:
    name: Dependency scan (Trivy fs, non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (vuln report, exit-code 0)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          output: trivy-report.txt
          exit-code: '0'
          skip-dirs: .git,target,node_modules,frontend/node_modules,.m2-repo

      - name: Tee report to log and write counts to job summary
        shell: bash
        run: |
          cat trivy-report.txt
          {
            echo '## Trivy dependency scan (non-blocking report)'
            echo ''
            echo "- Report file: \`trivy-report.txt\` ($(wc -l < trivy-report.txt | tr -d ' ') lines)"
            echo "- Distinct CVE count: $(grep -oE 'CVE-[0-9]{4}-[0-9]+' trivy-report.txt | sort -u | wc -l | tr -d ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan report artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trivy-dependency-report
          path: trivy-report.txt
          if-no-files-found: error
