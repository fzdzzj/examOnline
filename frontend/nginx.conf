# =============================================================================
# examOnline 前端 Nginx 配置（add-deployment-stack）
#
# 双层 server：
#   1. HTTP(:80) server —— 一律 301 重定向到 HTTPS（TLS 终结强制）。
#   2. HTTPS(:443) server —— 证书走挂载点注入（/etc/nginx/certs/，见 compose）；
#      SPA 托管（非 /api/ 路径 try_files 回退 index.html）；
#      /api/ 同源反代到应用容器(app:8080)——后端 14 个 Controller 路径本身带
#      /api 前缀，前端 baseURL='' 即同源，见 frontend/src/api/config.ts。
#      client_max_body_size 对齐后端 multipart 上限（application.yml
#      spring.servlet.multipart.max-request-size: 50MB——nginx 默认 1M 会挡上传）。
#
# dev 走 Vite 代理；本文件是生产同源反代载体，前端源码零改动即工作。
# =============================================================================
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 上传上限必须 >= 后端 multipart max-request-size（50MB），两侧对齐
    client_max_body_size 50m;

    # 访问日志关闭（前端纯托管，日志进 upload/syslog 由 compose 采集，避免容器日志刷爆）
    access_log off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    upstream exam_api {
        # 应用容器名/服务名 = app，端口 8080（application.yml server.port）
        server app:8080;
    }

    # ---- HTTP → HTTPS 301 强制重定向 ----
    server {
        listen 80;
        server_name _;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS：TLS 终结 + SPA 托管 + /api/ 反代 ----
    server {
        listen 443 ssl;
        server_name _;

        # 证书经挂载点注入（docker/certs/out/ → /etc/nginx/certs/，见 docker-compose.prod.yml）
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # 前端静态资源（SPA 构建产物由前端 Dockerfile 拷入）
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            # Vue 文件路由：直接访问前端路由路径时回退入口 HTML，交给前端 router
            try_files $uri $uri/ /index.html;
        }

        # API 同源反代：路径本身带 /api 前缀，原样转发，不 rewrite
        location /api/ {
            proxy_pass http://exam_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 题干图片反代（add-question-image）：下载端点置 /api 外（公开只读，随机 UUID 文件名即凭据）。
        # ^~ 前缀优先于下方静态扩展名正则——/images/xxx.png 不会落入静态资源位置（那会 404）。
        location ^~ /images/ {
            proxy_pass http://exam_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 静态资源缓存：带 hash 的构建产物可长缓存（前端产物文件名含内容 hash）
        location ~* \.(?:js|css|png|jpe?g|gif|svg|woff2?|ico)$ {
            root  /usr/share/nginx/html;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}