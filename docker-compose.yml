# =============================================================
# examOnline —— 中间件一键编排（add-project-skeleton, W1）
#   docker compose up -d
# 包含：MySQL 主从（GTID 复制）+ Redis 7 + RabbitMQ(management)
# 健康检查 + depends_on 保证启动依赖顺序
# =============================================================
services:

  mysql-master:
    image: mysql:8.0
    container_name: exam-mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: exam_online
      TZ: Asia/Shanghai
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-do-db=exam_online
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/master/init:/docker-entrypoint-initdb.d:ro
      - master-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot123 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-slave:
    image: mysql:8.0
    container_name: exam-mysql-slave
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: exam_online
      TZ: Asia/Shanghai
    command:
      - --server-id=2
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --skip-log-bin
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql/slave/init:/docker-entrypoint-initdb.d:ro
      - slave-data:/var/lib/mysql
    depends_on:
      mysql-master:
        condition: service_healthy   # 主库健康后再启动从库
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot123 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    container_name: exam-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: exam-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: exam
      RABBITMQ_DEFAULT_PASS: exam123
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  master-data:
  slave-data:
  redis-data:
  rabbitmq-data:
